<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartArt Solutions - Privacy Policy</title>
  <style>
    body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;margin:0;padding:0;line-height:1.8;background:linear-gradient(135deg,#667eea 0%,#764ba2 25%,#f093fb 50%,#4facfe 75%,#00f2fe 100%);background-attachment:fixed;color:#333}
    header{background:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#f093fb 100%);color:white;padding:2em 1em;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.3)}
    header h1{margin:0;font-size:2.5em;text-shadow:2px 2px 4px rgba(0,0,0,.3);background:linear-gradient(45deg,#fff,#f0f0f0,#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 3s infinite}
    @keyframes shimmer{0%,100%{opacity:1}50%{opacity:.8}}
    header p{margin:.5em 0 0;font-size:1.3em;text-shadow:1px 1px 2px rgba(0,0,0,.2)}
    section{padding:2em 1em;max-width:900px;margin:2em auto;background:white;border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,.2)}
    section:nth-child(odd){border-left:6px solid #667eea}
    section:nth-child(even){border-left:6px solid #f093fb}
    h2{background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-top:1em;font-size:2em;border-bottom:3px solid #f093fb;padding-bottom:.3em}
    h3{color:#764ba2;margin-top:1.5em;font-size:1.4em;border-left:4px solid #4facfe;padding-left:.5em}
    p{margin:1em 0;text-align:justify}
    ul{margin:1em 0;padding-left:2em}
    li{margin:.5em 0;color:#555}
    strong{color:#667eea}
    footer{text-align:center;padding:2em 1em;background:linear-gradient(135deg,#764ba2,#667eea);color:white;font-size:.9em;box-shadow:0 -4px 20px rgba(0,0,0,.2)}
    nav.menu{background:rgba(0,0,0,.3);padding:.5em 0;text-align:center;margin-bottom:1em;backdrop-filter:blur(10px)}
    nav.menu a{color:white;text-decoration:none;padding:.5em 1.5em;display:inline-block;transition:all .3s;border:2px solid transparent;border-radius:25px;font-weight:500;margin:0 .5em}
    nav.menu a:hover{background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.1));border-color:rgba(255,255,255,.6);transform:translateY(-2px);box-shadow:0 4px 12px rgba(255,255,255,.3)}
    nav.menu a.active{background:linear-gradient(135deg,#f093fb,#4facfe);color:white;border-color:white;font-weight:600;box-shadow:0 4px 15px rgba(240,147,251,.5)}
    .highlight-box{background:linear-gradient(135deg,#fff5f5,#ffe5f5);border-left:4px solid #f093fb;padding:1em;margin:1.5em 0;border-radius:10px}
    .contact-box{background:linear-gradient(135deg,#e0f2ff,#f0e5ff);padding:1.5em;border-radius:15px;margin:2em 0;text-align:center;border:2px solid #667eea}
    [dir="rtl"] h3{border-left:none;border-right:4px solid #4facfe;padding-left:0;padding-right:.5em}
    [dir="rtl"] .highlight-box{border-left:none;border-right:4px solid #f093fb}
    [dir="rtl"] p{text-align:right}
    #loading{text-align:center;padding:4em;color:white;font-size:1.2em}
  </style>
</head>
<body>
<div id="app"><div id="loading">Loading...</div></div>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var lang = params.get('lang') || localStorage.getItem('siteLang') || 'en';
  var validLangs = ['ar','bg','cs','da','de','el','en','es','fi','fr','hu','id','it','ja','ko','nl','no','pl','pt','ro','ru','sk','sv','tr','uk','zh'];
  if (validLangs.indexOf(lang) === -1) lang = 'en';

  function render() {
    localStorage.setItem('siteLang', lang);
    var t = window.SiteT;
    document.documentElement.lang = lang;
    document.documentElement.dir = t.dir || 'ltr';
    document.title = 'SmartArt Solutions - ' + t.privacyTitle;
    document.getElementById('app').innerHTML =
      '<header>' +
        '<nav class="menu">' +
          '<a href="index.html">' + t.navHome + '</a>' +
          '<a href="privacy-policy.html?lang=' + lang + '" class="active">' + t.navPrivacy + '</a>' +
          '<a href="terms.html?lang=' + lang + '">' + t.navTerms + '</a>' +
        '</nav>' +
        '<h1>SmartArt Solutions</h1>' +
      '</header>' +
      '<section>' + t.privacyContent + '</section>' +
      '<footer>' + t.footer + '</footer>';
  }

  function loadLang(code, fallback) {
    var s = document.createElement('script');
    s.src = 'lang/' + code + '.js';
    s.onload = render;
    s.onerror = function() {
      if (fallback) {
        loadLang('en', false);
      } else {
        document.getElementById('app').innerHTML = '<div id="loading">Content unavailable.</div>';
      }
    };
    document.head.appendChild(s);
  }

  loadLang(lang, lang !== 'en');
})();
</script>
</body>
</html>
